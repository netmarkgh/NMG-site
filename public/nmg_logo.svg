<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ghana Map Background Shape (Simplified) -->
  <g clip-path="url(#mapClip)">
    <path d="M15 15 C 20 10, 40 10, 45 15 L 48 30 C 50 40, 45 50, 40 60 L 20 65 C 10 60, 5 40, 10 30 Z" fill="#EF4444"/> <!-- Red top -->
    <rect x="0" y="30" width="60" height="20" fill="#FACC15"/> <!-- Gold middle -->
    <rect x="0" y="50" width="60" height="30" fill="#22C55E"/> <!-- Green bottom -->
  </g>
  <defs>
    <clipPath id="mapClip">
      <path d="M15 15 C 20 10, 40 10, 45 15 L 48 30 C 50 40, 45 50, 40 60 L 20 65 C 10 60, 5 40, 10 30 Z" />
    </clipPath>
  </defs>

  <!-- Shopping Cart Icon (White) -->
  <path d="M8 25 L15 25 L22 45 L45 45 L50 30 L18 30" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25" cy="50" r="2.5" fill="white"/>
  <circle cx="42" cy="50" r="2.5" fill="white"/>
  <path d="M22 35 L48 35" stroke="white" stroke-width="1.5"/>
  <path d="M30 30 L30 45" stroke="white" stroke-width="1.5"/>
  <path d="M40 30 L40 45" stroke="white" stroke-width="1.5"/>

  <!-- Text: NET -->
  <text x="65" y="45" font-family="sans-serif" font-weight="900" font-size="40" fill="white">NET</text>
  <!-- Text: MARKETING GHANA -->
  <text x="65" y="65" font-family="sans-serif" font-weight="500" font-size="12" fill="white" letter-spacing="1">MARKETING GHANA</text>
</svg>
